name: Update Data & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Runs on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Use ci (exact lockfile) if one is committed; generate it on first run
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Fetch latest data (GDP, electricity, income)
        continue-on-error: true
        run: node scripts/fetch-data.js

      - name: Build site
        run: npm run build

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.json docs/ package-lock.json
          git add data/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: auto-update metrics data $(date +'%Y-%m-%d')" && git push)
