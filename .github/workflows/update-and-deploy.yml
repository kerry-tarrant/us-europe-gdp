name: Update Data & Deploy

on:
  schedule:
    # Runs every April 29 at 10:00 UTC — after IMF WEO April release
    - cron: '0 10 29 4 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Use ci (exact lockfile) if one is committed; generate it on first run
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Fetch latest GDP data
        run: node scripts/fetch-data.js

      - name: Build site
        run: npm run build

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx docs/ data/ package-lock.json
          git diff --cached --quiet || (git commit -m "chore: auto-update GDP data $(date +'%Y-%m-%d')" && git push)
